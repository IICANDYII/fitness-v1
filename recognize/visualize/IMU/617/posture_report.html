// ─── 饼图 ──────────────────────────────────────
(function drawPie() {
  const canvas = document.getElementById("pieCanvas");
  const ctx = canvas.getContext("2d");
  const cx = 90, cy = 90, r = 76;
  let angle = -Math.PI / 2;
  SUMMARY.forEach(d => {
    const slice = (d.pct / 100) * 2 * Math.PI;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, angle, angle + slice);
    ctx.closePath();
    ctx.fillStyle = COLOR[d.key];
    ctx.fill();
    angle += slice;
  });
  // center hole
  ctx.beginPath();
  ctx.arc(cx, cy, 40, 0, 2 * Math.PI);
  ctx.fillStyle = "#1a1d27";
  ctx.fill();
  // center text
  ctx.fillStyle = "#e2e8f0";
  ctx.font = "bold 13px system-ui";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("5.8 min", cx, cy);
})();

// ─── 时间轴 ───────────────────────────────────
(function buildTimeline() {
  const bar = document.getElementById("tlBar");
  const ruler = document.getElementById("tlRuler");
  const tt = document.getElementById("tooltip");

  SEGMENTS.forEach(seg => {
    const left = (seg.start / TOTAL_SEC * 100).toFixed(3);
    const width = (seg.dur / TOTAL_SEC * 100).toFixed(3);
    const div = document.createElement("div");
    div.className = "tl-seg";
    div.style.left = left + "%";
    div.style.width = width + "%";
    div.style.background = COLOR[seg.label] || "#666";
    div.style.opacity = "0.88";

    div.addEventListener("mousemove", e => {
      tt.style.display = "block";
      tt.style.left = (e.clientX + 14) + "px";
      tt.style.top  = (e.clientY - 36) + "px";
      const ts = new Date(2026, 5, 17, 18, 57, 34 + seg.start);
      const hh = String(ts.getHours()).padStart(2,'0');
      const mm = String(ts.getMinutes()).padStart(2,'0');
      const ss = String(ts.getSeconds()).padStart(2,'0');
      tt.innerHTML = `<strong>${seg.zh}</strong><br>起: ${hh}:${mm}:${ss}<br>时长: ${seg.dur}s`;
    });
    div.addEventListener("mouseleave", () => { tt.style.display = "none"; });
    bar.appendChild(div);
  });

  // ruler: 0, 1min, 2min, ... 5min
  for (let m = 0; m <= 6; m++) {
    const s = m * 60;
    if (s > TOTAL_SEC + 5) break;
    const tick = document.createElement("span");
    tick.textContent = m + "min";
    ruler.appendChild(tick);
  }
})();
