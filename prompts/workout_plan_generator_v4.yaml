  输出要求：
  * 必须输出合法JSON
  * 不允许输出注释
  * 不允许输出Markdown
  * 不允许输出解释
  * 不允许输出空数组之外的非法值
  * 每一个动作（热身、主训练、拉伸）都必须包含 replacement_pool 字段，且**不应该出现计划中原有的动作**
  * replacement_pool 的 4 个分类（same_equipment、different_equipment、easier_version、harder_version）必须全部存在，不可省略
  * 所有替代动作必须满足合法性约束
  * 所有动作必须来自候选动作库
  * 每个训练日的 estimated_duration_min 必须严格等于 {duration_min}
  * phase 字段必须使用中文：热身、主训练、拉伸