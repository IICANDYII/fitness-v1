<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>训练计划 · 用户画像</title>
<style>
  /* ── Reset & Base ───────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --card:     #21253a;
    --border:   #2e334d;
    --accent:   #6c63ff;
    --accent2:  #ff6584;
    --green:    #43e97b;
    --yellow:   #f9d423;
    --text:     #e8eaf0;
    --muted:    #7b80a0;
    --radius:   14px;
    --shadow:   0 4px 24px rgba(0,0,0,.45);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  /* ── Layout ─────────────────────────────────────────────── */
  .page { max-width: 1100px; margin: 0 auto; }
  header {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 32px;
  }
  header .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center;
    font-size: 26px; flex-shrink: 0;
  }
  header h1 { font-size: 1.5rem; font-weight: 700; }
  header p  { font-size: .85rem; color: var(--muted); margin-top: 2px; }

  .grid-2 {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 800px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  /* ── Card ───────────────────────────────────────────────── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: .7rem; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 18px;
  }

  /* ── Profile stats ──────────────────────────────────────── */
  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: .9rem;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .label { color: var(--muted); }
  .stat-row .value { font-weight: 600; }

  /* ── Pill tags ──────────────────────────────────────────── */
  .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .pill {
    background: rgba(108,99,255,.15);
    border: 1px solid rgba(108,99,255,.35);
    color: #a09cf9;
    border-radius: 20px;
    padding: 4px 13px;
    font-size: .78rem; font-weight: 500;
  }
  .pill.green  { background: rgba(67,233,123,.12); border-color: rgba(67,233,123,.3); color: #43e97b; }
  .pill.yellow { background: rgba(249,212,35,.12); border-color: rgba(249,212,35,.3); color: #f9d423; }

  /* ── Radar chart placeholder ────────────────────────────── */
  #radar-wrap { position: relative; width: 100%; aspect-ratio: 1; max-width: 260px; margin: 0 auto; }

  /* ── Goal ring ──────────────────────────────────────────── */
  .goal-ring-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 10px 0;
  }
  .goal-ring-wrap canvas { display: block; }
  .goal-label { font-size: .85rem; color: var(--muted); }
  .goal-value { font-size: 1.8rem; font-weight: 800; color: var(--accent); margin-top: -6px; }

  /* ── Schedule tabs ──────────────────────────────────────── */
  .day-tabs {
    display: flex; gap: 8px; overflow-x: auto;
    padding-bottom: 4px; margin-bottom: 20px;
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 18px;
    cursor: pointer;
    font-size: .85rem; font-weight: 600;
    color: var(--muted);
    transition: all .2s;
  }
  .day-tab:hover { border-color: var(--accent); color: var(--text); }
  .day-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ── Exercise timeline ──────────────────────────────────── */
  .timeline { position: relative; padding-left: 28px; }
  .timeline::before {
    content: '';
    position: absolute; left: 9px; top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, var(--accent), transparent);
  }
  .tl-item { position: relative; margin-bottom: 16px; }
  .tl-dot {
    position: absolute; left: -28px; top: 6px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
  }
  .tl-dot.warmup  { background: var(--yellow); }
  .tl-dot.stretch { background: var(--green);  }
  .tl-dot.superset{ background: var(--accent2);}

  .ex-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    transition: border-color .2s;
    /* align-items: stretch (默认) 让 .muscle-mini 与 .ex-card-body 同高 */
    display: flex; align-items: stretch; gap: 10px;
  }
  .ex-card-body { flex: 1; min-width: 0; }
  .ex-card:hover { border-color: var(--accent); }
  .ex-card.warmup  { border-left: 3px solid var(--yellow); }
  .ex-card.stretch { border-left: 3px solid var(--green); }
  .ex-card.superset{ border-left: 3px solid var(--accent2); }

  /* ── Muscle mini (inline SVG) ──────────────────────────── */
  .muscle-mini {
    flex-shrink: 0;
    align-self: stretch;
    width: 72px;
    background: rgb(26,29,39);           /* 外层深色背景 */
    border-radius: 10px;
    border: 1.5px solid rgba(255,255,255,0.08); /* 细边框，与 ex-card 区分 */
    padding: 6px;
    display: flex;
    align-items: stretch;
    justify-content: center;
  }
  .muscle-mini-inner {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: rgb(26,29,39);           /* 与外层 .muscle-mini 同色 */
    border-radius: 6px;
  }
  .muscle-mini svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  /* base: subtle white — body shape barely visible on dark bg (overridden by inline style) */
  .muscle-mini .bodymap path,
  .muscle-mini .bodymap circle,
  .muscle-mini .bodymap ellipse { fill: rgba(255,255,255,0.10); }
  /* body skeleton outline — thicker for visibility */
  .muscle-mini #body path,
  .muscle-mini #body line { stroke: rgba(255,255,255,0.70); stroke-opacity: 1; stroke-width: 12; fill: none !important; }
  .muscle-mini #shoulders, .muscle-mini #elbow, .muscle-mini #wrist,
  .muscle-mini #hips, .muscle-mini #knees, .muscle-mini #ankles,
  .muscle-mini #upper-spine, .muscle-mini #lower-spine, .muscle-mini #scapula,
  .muscle-mini [id^="hover"] { display: none; }

  /* ── Coaching notes ─────────────────────────────────────── */
  .coaching-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
  }
  @media (max-width: 600px) { .coaching-grid { grid-template-columns: 1fr; } }
  .coaching-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 15px;
    display: flex;
    gap: 10px;
  }
  .coaching-item-icon {
    font-size: 1.3rem;
    flex-shrink: 0;
    line-height: 1;
    margin-top: 2px;
  }
  .coaching-item-title {
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .coaching-item-body {
    font-size: .82rem;
    line-height: 1.6;
    color: #bec3e0;
  }

  .ex-header {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 12px;
  }
  .ex-name { font-weight: 700; font-size: .95rem; }
  .ex-phase {
    font-size: .68rem; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; border-radius: 6px;
    padding: 3px 9px; flex-shrink: 0;
    background: rgba(108,99,255,.2); color: #a09cf9;
  }
  .ex-phase.warmup  { background: rgba(249,212,35,.15); color: var(--yellow); }
  .ex-phase.stretch { background: rgba(67,233,123,.15); color: var(--green); }
  .ex-phase.superset{ background: rgba(255,101,132,.15); color: var(--accent2); }

  .ex-meta {
    display: flex; flex-wrap: wrap; gap: 14px;
    margin-top: 8px; font-size: .82rem; color: var(--muted);
  }
  .ex-meta span { display: flex; align-items: center; gap: 5px; }
  .ex-notes {
    margin-top: 10px; font-size: .8rem; color: #8e93b2;
    line-height: 1.55; padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  /* ── Coaching notes ─────────────────────────────────────── */
  .notes-box {
    background: rgba(108,99,255,.08);
    border: 1px solid rgba(108,99,255,.25);
    border-radius: var(--radius);
    padding: 18px 20px;
    font-size: .88rem; line-height: 1.7;
    color: #bec3e0;
    white-space: pre-wrap;
    margin-top: 20px;
  }

  /* ── Summary chips ──────────────────────────────────────── */
  .summary-chips {
    display: flex; flex-wrap: wrap; gap: 12px;
    margin-bottom: 20px;
  }
  .chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    text-align: center;
  }
  .chip .cv { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
  .chip .cl { font-size: .72rem; color: var(--muted); margin-top: 2px; }

  /* ── Edit button ────────────────────────────────────────── */
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .card-header .card-title { margin-bottom: 0; }
  .btn-edit {
    background: rgba(108,99,255,.15);
    border: 1px solid rgba(108,99,255,.4);
    color: #a09cf9;
    border-radius: 8px;
    padding: 4px 12px;
    font-size: .72rem; font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-edit:hover { background: rgba(108,99,255,.3); color: #fff; }
  .btn-save {
    background: rgba(67,233,123,.15);
    border: 1px solid rgba(67,233,123,.4);
    color: #43e97b;
    border-radius: 8px;
    padding: 4px 12px;
    font-size: .72rem; font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    margin-right: 6px;
  }
  .btn-save:hover { background: rgba(67,233,123,.3); color: #fff; }
  .btn-cancel {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.12);
    color: var(--muted);
    border-radius: 8px;
    padding: 4px 12px;
    font-size: .72rem; font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-cancel:hover { background: rgba(255,255,255,.1); color: var(--text); }

  /* ── Editable field inputs ───────────────────────────────── */
  .edit-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: .9rem;
    gap: 12px;
  }
  .edit-row:last-child { border-bottom: none; }
  .edit-row .label { color: var(--muted); flex-shrink: 0; }
  .edit-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: .88rem;
    padding: 4px 9px;
    width: 130px;
    text-align: right;
    outline: none;
  }
  .edit-input:focus { border-color: var(--accent); }
  .edit-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: .88rem;
    padding: 4px 9px;
    width: 130px;
    outline: none;
  }
  .edit-select:focus { border-color: var(--accent); }

  /* ── Tag editor ──────────────────────────────────────────── */
  .tag-section { margin-top: 14px; }
  .tag-section-label { font-size: .78rem; color: var(--muted); margin-bottom: 8px; }
  .tag-edit-area {
    display: flex; flex-wrap: wrap; gap: 6px;
    min-height: 32px;
    align-items: center;
  }
  .pill-editable {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(108,99,255,.15);
    border: 1px solid rgba(108,99,255,.35);
    color: #a09cf9;
    border-radius: 20px;
    padding: 4px 8px 4px 13px;
    font-size: .78rem; font-weight: 500;
  }
  .pill-editable.green { background: rgba(67,233,123,.12); border-color: rgba(67,233,123,.3); color: #43e97b; }
  .pill-editable.yellow { background: rgba(249,212,35,.12); border-color: rgba(249,212,35,.3); color: #f9d423; }
  .pill-del {
    background: none; border: none; cursor: pointer;
    color: inherit; opacity: .6;
    font-size: .9rem; line-height: 1;
    padding: 0; display: flex;
  }
  .pill-del:hover { opacity: 1; }
  .tag-add-row {
    display: flex; align-items: center; gap: 6px; margin-top: 8px;
  }
  .tag-add-input {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 20px;
    color: var(--text);
    font-size: .78rem;
    padding: 4px 12px;
    width: 110px;
    outline: none;
  }
  .tag-add-input:focus { border-color: var(--accent); }
  .btn-tag-add {
    background: rgba(108,99,255,.2);
    border: 1px solid rgba(108,99,255,.4);
    color: #a09cf9;
    border-radius: 50%;
    width: 22px; height: 22px;
    font-size: .9rem; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .15s;
  }
  .btn-tag-add:hover { background: rgba(108,99,255,.4); color: #fff; }

  /* ── Schedule regen overlay ──────────────────────────────── */
  .regen-overlay {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px;
    padding: 48px 20px;
    color: var(--muted); font-size: .9rem;
  }
  .regen-overlay .spinner { margin: 0; }

  /* ── User selector ───────────────────────────────────────── */
  .user-selector-bar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 24px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .user-selector-bar label {
    font-size: .78rem; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
    flex-shrink: 0;
  }
  .user-select {
    flex: 1; max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: .88rem;
    padding: 7px 12px;
    outline: none;
    cursor: pointer;
  }
  .user-select:focus { border-color: var(--accent); }
  .user-select option { background: var(--card); color: var(--text); }

  /* ── Loading ─────────────────────────────────────────────── */
  #loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: grid; place-items: center;
    z-index: 999;
    font-size: 1.1rem; color: var(--muted);
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Error ───────────────────────────────────────────────── */
  .error-box {
    background: rgba(255,101,132,.1);
    border: 1px solid rgba(255,101,132,.3);
    color: var(--accent2);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin: 20px 0;
  }


  /* ── Validation issues badge ─────────────────────────────── */
  .validation-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(249,212,35,.1);
    border: 1px solid rgba(249,212,35,.3);
    color: var(--yellow);
    border-radius: 7px;
    padding: 3px 9px;
    font-size: .72rem; font-weight: 600;
    cursor: pointer;
  }
  .validation-badge.ok {
    background: rgba(67,233,123,.1);
    border-color: rgba(67,233,123,.3);
    color: var(--green);
  }
  .validation-list {
    display: none;
    margin-top: 10px;
    background: rgba(249,212,35,.06);
    border: 1px solid rgba(249,212,35,.2);
    border-radius: 8px;
    padding: 10px 13px;
    font-size: .78rem; line-height: 1.7; color: #d4c87a;
  }
  .validation-list.open { display: block; }

  /* ── Equipment scene ────────────────────────────────────── */
  .scene-section { margin-top: 16px; }
  .scene-section-label {
    font-size: .78rem; color: var(--muted); margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .scene-list { display: flex; flex-direction: column; gap: 8px; }
  .scene-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all .2s;
  }
  .scene-card:hover { border-color: var(--accent); }
  .scene-card.active {
    border-color: var(--green);
    background: rgba(67,233,123,.06);
  }
  .scene-card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .scene-card-name {
    font-size: .85rem; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .scene-card-name .active-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); display: inline-block;
  }
  .scene-card-actions {
    display: flex; gap: 4px;
  }
  .scene-card-actions button {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: .75rem; padding: 2px 6px;
    border-radius: 4px; transition: all .15s;
  }
  .scene-card-actions button:hover { color: var(--text); background: rgba(255,255,255,.08); }
  .scene-card-actions button.del:hover { color: var(--accent2); }
  .scene-equip-pills {
    display: flex; flex-wrap: wrap; gap: 5px;
  }
  .scene-equip-pills .pill { font-size: .72rem; padding: 2px 9px; }
  .scene-collapsed .scene-equip-pills { display: none; }
  .btn-add-scene {
    background: rgba(108,99,255,.12);
    border: 1px dashed rgba(108,99,255,.35);
    border-radius: 10px;
    padding: 8px;
    text-align: center;
    cursor: pointer;
    color: #a09cf9;
    font-size: .78rem;
    transition: all .2s;
  }
  .btn-add-scene:hover { background: rgba(108,99,255,.2); border-style: solid; }

  /* ── Scene edit modal ───────────────────────────────────── */
  .scene-modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: grid; place-items: center;
    z-index: 1000;
  }
  .scene-modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 380px; max-width: 90vw;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  .scene-modal h3 {
    font-size: .95rem; margin-bottom: 16px;
  }
  .scene-modal label {
    font-size: .78rem; color: var(--muted); display: block; margin-bottom: 6px;
  }
  .scene-modal input[type="text"] {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: .88rem;
    padding: 6px 10px;
    width: 100%;
    outline: none;
    margin-bottom: 14px;
  }
  .scene-modal input[type="text"]:focus { border-color: var(--accent); }
  .equip-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    margin-bottom: 18px;
  }
  .equip-option {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 0;
    text-align: center;
    cursor: pointer;
    font-size: .78rem;
    transition: all .15s;
    user-select: none;
  }
  .equip-option:hover { border-color: var(--accent); }
  .equip-option.selected {
    background: rgba(67,233,123,.12);
    border-color: rgba(67,233,123,.4);
    color: var(--green);
    font-weight: 600;
  }
  .scene-modal-btns {
    display: flex; justify-content: flex-end; gap: 8px;
  }

  /* ── Exercise swap button & panel ──────────────────────────── */
  .btn-swap {
    background: rgba(108,99,255,.12);
    border: 1px solid rgba(108,99,255,.3);
    color: #a09cf9;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: .7rem; font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    margin-top: 6px;
  }
  .btn-swap:hover { background: rgba(108,99,255,.25); color: #fff; }
  .swap-panel {
    margin-top: 10px;
    background: rgba(108,99,255,.06);
    border: 1px solid rgba(108,99,255,.2);
    border-radius: 8px;

<body>

<script>
// ════════════════════════════════════════════════════════════
// Data fetch
// ════════════════════════════════════════════════════════════
const API = '';  // same-origin; change if backend on different port
let _currentUserId = '';  // set after user list loads

function _uq(extra = '') {
  const parts = [];
  if (_currentUserId) parts.push(`user_id=${encodeURIComponent(_currentUserId)}`);
  if (extra) parts.push(extra);
  return parts.length ? '?' + parts.join('&') : '';
}

async function fetchData() {
  // Stage 1: fetch profile + plan + muscle map in parallel
  const [profileRes, planRes, musclesRes] = await Promise.all([
    fetch(`${API}/api/plan-viewer/profile${_uq()}`),
    fetch(`${API}/api/plan-viewer/latest-plan${_uq(`version=${_currentVersion}`)}`),
    fetch(`${API}/api/plan-viewer/muscles-map${_uq()}`),
  ]);
  if (!profileRes.ok || !planRes.ok) throw new Error('API 请求失败');

  const profile = await profileRes.json();

  // Stage 2: use profile.gender (plan-viewer 用户的真实性别) 选择身体图
  const isFemale  = profile.gender === 'female' || profile.gender === '女';
  const frontFile = isFemale ? 'female_front_body.svg' : 'front_body.svg';
  const backFile  = isFemale ? 'female_back_body.svg'  : 'back_body.svg';

  const [frontSvgRes, backSvgRes] = await Promise.all([
    fetch(`${API}/svg/${frontFile}`),
    fetch(`${API}/svg/${backFile}`),
  ]);

  return {
    profile,
    plan:      await planRes.json(),
    muscleMap: musclesRes.ok ? await musclesRes.json() : {},
    frontSvg:  frontSvgRes.ok ? await frontSvgRes.text() : '',
    backSvg:   backSvgRes.ok  ? await backSvgRes.text()  : '',
  };
}

// ════════════════════════════════════════════════════════════
// Muscle diagram — mirrors dashboard Card 2 applyHeatmap logic
// ════════════════════════════════════════════════════════════

// Muscle highlight colors (background = rgb(40,37,43) dark)
const HEAT_NONE      = 'rgba(255,255,255,0.10)'; // subtle white: body shape visible on dark bg
const HEAT_PRIMARY   = 'rgb(238,122,90)';         // deep orange: primary muscle highlight
const HEAT_SECONDARY = 'rgba(238,122,90,0.38)';   // light orange: secondary muscle

// Chinese muscle name → {side, svgId}
// 注意: plan_viewer 直接 fetch 原始 SVG 文件，ID 无 "b-" 前缀
// （"b-" 前缀仅在 gen_dashboard.py 内联合并时才会加）
const MUSCLE_SVG_MAP = {
  // ── Front ──────────────────────────────────────────────────
  '股四头肌':    { side: 'front', id: 'quads' },
  '腹直肌':      { side: 'front', id: 'abdominals' },
  '腹斜肌':      { side: 'front', id: 'obliques' },
  '胸大肌':      { side: 'front', id: 'chest' },
  '三角肌前束':  { side: 'front', id: 'front-shoulders' },
  '三角肌中束':  { side: 'front', id: 'front-shoulders' },
  '肱二头肌':    { side: 'front', id: 'biceps' },
  '腓肠肌':      { side: 'front', id: 'calves' },
  '前臂肌群':    { side: 'front', id: 'forearms' },
  '前臂屈肌群':  { side: 'front', id: 'forearms' },
  '髋屈肌群':    { side: 'front', id: 'quads' },
  // ── Back ───────────────────────────────────────────────────
  '背阔肌':      { side: 'back', id: 'lats' },
  '臀大肌':      { side: 'back', id: 'glutes' },
  '臀中肌':      { side: 'back', id: 'glutes' },
  '腘绳肌':      { side: 'back', id: 'hamstrings' },
  '竖脊肌':      { side: 'back', id: 'lowerback' },
  '下背部':      { side: 'back', id: 'lowerback' },
  '斜方肌':      { side: 'back', id: 'traps' },
  '斜方肌中部':  { side: 'back', id: 'traps-middle' },
  '三角肌后束':  { side: 'back', id: 'rear-shoulders' },
  '三角肌':      { side: 'back', id: 'rear-shoulders' },
  '肱三头肌':    { side: 'back', id: 'triceps' },
  '菱形肌':      { side: 'back', id: 'traps-middle' },
  '小圆肌':      { side: 'back', id: 'rear-shoulders' },
  '冈下肌':      { side: 'back', id: 'rear-shoulders' },
};

// Inline SVG DOM references (set once after SVGs are fetched+injected)
let _frontSvgEl = null, _backSvgEl = null;

// Inject both SVGs as hidden templates into the page
function injectSvgTemplates(frontText, backText) {
  const parser = new DOMParser();

  function prepare(text, containerId) {
    const doc = parser.parseFromString(text, 'image/svg+xml');
    const svg = doc.querySelector('svg');
    // Body skeleton: thicker stroke for visibility on dark background
    svg.querySelectorAll('#body path, #body line, #body-head path').forEach(el => {
      el.style.strokeOpacity = '1';
      el.style.stroke = 'rgba(255,255,255,0.70)';
      el.style.strokeWidth = '12';
      el.style.fill = 'none';
    });
    // Pre-set all bodymap paths to HEAT_NONE (overridden per-muscle by applyMuscleColors)
    const isBack = containerId === 'svg-back-tpl';
    svg.querySelectorAll('.bodymap path, .bodymap circle, .bodymap ellipse').forEach(p => {
      p.style.fill = isBack ? HEAT_NONE : HEAT_NONE;
    });
    // Normalize IDs: female_back_body.svg uses "b-" prefix; strip it so MUSCLE_SVG_MAP matches
    svg.querySelectorAll('[id^="b-"]').forEach(el => { el.id = el.id.slice(2); });
    // Remove class-based Tailwind hover rules that don't apply here
    svg.removeAttribute('class');
    svg.setAttribute('viewBox', svg.getAttribute('viewBox') || '0 0 660 1206');
    svg.style.cssText = '';

    const wrap = document.getElementById(containerId);
    wrap.innerHTML = '';
    wrap.appendChild(document.adoptNode(svg));
    return wrap.querySelector('svg');
  }

  _frontSvgEl = prepare(frontText, 'svg-front-tpl');
  _backSvgEl  = prepare(backText,  'svg-back-tpl');
}

// Apply muscle colors to a CLONED inline SVG (dashboard applyHeatmap pattern)
const HEAT_NONE_BACK = 'rgba(255,255,255,0.22)';

function applyMuscleColors(svgEl, primaryIds, secondaryIds, isBack) {
  const base = isBack ? HEAT_NONE_BACK : HEAT_NONE;
  svgEl.querySelectorAll('.bodymap path, .bodymap circle, .bodymap ellipse').forEach(p => {
    p.style.fill = base;
    if (isBack) {
      p.style.stroke = 'rgba(255,255,255,0.45)';
      p.style.strokeWidth = '2';
      p.style.paintOrder = 'stroke fill';
      p.style.strokeLinejoin = 'round';
    }
  });
  // Primary → full purple
  primaryIds.forEach(id => {
    svgEl.querySelectorAll(`[id="${id}"] path, [id="${id}"] ellipse, [id="${id}"] circle`).forEach(p => {
      p.style.fill = HEAT_PRIMARY;
    });
  });
  // Secondary → mid purple
  secondaryIds.forEach(id => {
    if (primaryIds.includes(id)) return;
    svgEl.querySelectorAll(`[id="${id}"] path, [id="${id}"] ellipse, [id="${id}"] circle`).forEach(p => {
      p.style.fill = HEAT_SECONDARY;
    });
  });
}

function buildMuscleMini(exerciseId, muscleMap) {
  if (!_frontSvgEl || !_backSvgEl) return '';
  const info = muscleMap[exerciseId];
  if (!info) return '';

  const primary   = info.primary   || [];
  const secondary = info.secondary || [];

  const frontPrimary = [], frontSecondary = [];
  const backPrimary  = [], backSecondary  = [];

  for (const m of primary) {
    const map = MUSCLE_SVG_MAP[m];
    if (!map) continue;
    (map.side === 'front' ? frontPrimary : backPrimary).push(map.id);
  }
  for (const m of secondary) {
    const map = MUSCLE_SVG_MAP[m];
    if (!map) continue;
    (map.side === 'front' ? frontSecondary : backSecondary).push(map.id);
  }

  const hasFront = frontPrimary.length || frontSecondary.length;
  const hasBack  = backPrimary.length  || backSecondary.length;
  if (!hasFront && !hasBack) return '';

  // Tooltip
  const tip = [
    primary.filter(m => MUSCLE_SVG_MAP[m]).length
      ? '主: ' + primary.filter(m => MUSCLE_SVG_MAP[m]).join('、') : '',
    secondary.filter(m => MUSCLE_SVG_MAP[m]).length
      ? '辅: ' + secondary.filter(m => MUSCLE_SVG_MAP[m]).join('、') : '',
  ].filter(Boolean).join('\n');

  // 以主肌群所在面为优先：主肌群正面多 → 正面SVG；主肌群背面多 → 背面SVG
  // 主肌群相同时退而看辅肌群，最终默认正面
  const useFront = frontPrimary.length >= backPrimary.length
    ? (frontPrimary.length > 0 || frontSecondary.length >= backSecondary.length)
    : false;
  const src  = useFront ? _frontSvgEl  : _backSvgEl;
  const prim = useFront ? frontPrimary : backPrimary;
  const sec  = useFront ? frontSecondary : backSecondary;

  const clone = src.cloneNode(true);
  applyMuscleColors(clone, prim, sec, !useFront);
  clone.removeAttribute('width');
  clone.removeAttribute('height');

  const wrap  = document.createElement('div');
  wrap.className = 'muscle-mini';
  wrap.title = tip;
  const inner = document.createElement('div');
  inner.className = 'muscle-mini-inner';
  inner.appendChild(clone);
  wrap.appendChild(inner);
  return wrap.outerHTML;
}

// ════════════════════════════════════════════════════════════
// Render helpers
// ════════════════════════════════════════════════════════════
function phaseKey(phase) {
  if (!phase) return 'main';
  const p = phase.toLowerCase();
  if (p.includes('热身') || p.includes('warm')) return 'warmup';
  if (p.includes('拉伸') || p.includes('stretch') || p.includes('恢复')) return 'stretch';
  return 'main';
}

function icon(pk) {
  return { warmup: '🌡️', stretch: '🧘', main: '💪' }[pk] || '💪';
}

function renderProfile(profile) {
  const bmi = (profile.weight / ((profile.height / 100) ** 2)).toFixed(1);
  const rows = [
    ['性别',   profile.gender === 'female' ? '女' : '男'],
    ['年龄',   `${profile.age} 岁`],
    ['身高',   `${profile.height} cm`],
    ['体重',   `${profile.weight} kg`],
    ['BMI',    bmi],
    ['睡眠',   `${profile.sleep_hours} 小时 / 天`],
    ['训练目标', profile.fitness_goal],
    ['训练水平', profile.experience_level],
    ['每周天数', `${profile.available_schedule?.days_per_week || '-'} 天`],
    ['每次时长', `${profile.available_schedule?.daily_duration_min || '-'} 分钟`],
  ];
  document.getElementById('profile-stats').innerHTML = rows.map(([l, v]) =>
    `<div class="stat-row"><span class="label">${l}</span><span class="value">${v}</span></div>`
  ).join('');

  const styles = profile.preferred_training_style || [];
  const equip  = profile.available_equipment || [];
  document.getElementById('profile-tags').innerHTML = `
    <p style="font-size:.78rem;color:var(--muted);margin-bottom:8px">训练风格</p>
    <div class="pill-row">${styles.map(s=>`<span class="pill">${s}</span>`).join('')}</div>
    <p style="font-size:.78rem;color:var(--muted);margin:14px 0 8px">可用器械</p>
    <div class="pill-row" id="equip-pills">${equip.map(e=>`<span class="pill green">${e}</span>`).join('')}</div>
    <div class="scene-section">
      <div class="scene-section-label">
        <span>器械场景</span>
      </div>
      <div class="scene-list" id="scene-list"></div>
    </div>
    <div class="pill-row">${(profile.available_schedule?.free_time_slots||[]).map(t=>`<span class="pill yellow">${t}</span>`).join('')}</div>
  `;
  loadEquipmentScenes();
}

function renderSummary(schedule) {
  const totalEx = schedule.reduce((s,d)=>s+d.exercises.length,0);
  const totalMin = schedule.reduce((s,d)=>s+(d.estimated_duration_min||60),0);
  const phases = schedule.flatMap(d=>d.exercises.map(e=>e.phase||''));
  const warmupCount = phases.filter(p=>phaseKey(p)==='warmup').length;

  document.getElementById('summary-chips').innerHTML = [
    [schedule.length, '训练天数'],
    [totalEx, '总动作数'],
    [totalMin + ' min', '总时长'],
    [warmupCount, '热身动作'],
  ].map(([v,l])=>`<div class="chip"><div class="cv">${v}</div><div class="cl">${l}</div></div>`).join('');
}

function renderDayTabs(schedule, onSelect) {
  const container = document.getElementById('day-tabs');
  container.innerHTML = schedule.map((d,i) =>
    `<button class="day-tab${i===0?' active':''}" data-i="${i}">Day ${d.day}<br>
     <span style="font-size:.72rem;font-weight:400;color:inherit;opacity:.8">${d.theme||''}</span></button>`
  ).join('');
  container.querySelectorAll('.day-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.day-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      onSelect(+btn.dataset.i, +btn.dataset.i);
    });
  });
}

let _currentMuscleMap = {};
let _currentSchedule = [];
let _currentDayIndex = 0;

function buildSwapPanel(ex, dayIdx, exIdx) {
  const pool = ex.replacement_pool;
  if (!pool) return '';

  // Collect all exercise_ids already in this day's plan (to exclude from replacements)
  const dayExercises = _currentSchedule[dayIdx]?.exercises || [];
  const usedIds = new Set(dayExercises.map(e => e.exercise_id).filter(Boolean));

  const categories = [
    { key: 'same_equipment',     label: '同器械替换' },
    { key: 'different_equipment', label: '换器械替换' },
    { key: 'easier_version',     label: '更简单版本' },
    { key: 'harder_version',     label: '更难版本' },
  ];

  let hasAny = false;
  let items = '';
  const seenIds = new Set();  // cross-category dedup

  for (const cat of categories) {
    const list = pool[cat.key];
    if (!list || list.length === 0) continue;

    // Filter: skip duplicates across categories & skip exercises already in this day's plan
    const filtered = list.filter(r => {
      if (!r.exercise_id || seenIds.has(r.exercise_id) || usedIds.has(r.exercise_id)) return false;
      seenIds.add(r.exercise_id);
      return true;
    });
    if (filtered.length === 0) continue;

    hasAny = true;
    items += `<div class="swap-category">${cat.label}</div>`;
    for (const r of filtered) {
      const adj = r.volume_adjustment || {};
      const adjJson = JSON.stringify(adj).replace(/"/g, '&quot;');
      items += `
        <div class="swap-item">
          <span class="swap-item-name">${r.name}</span>
          <span class="swap-item-score">匹配 ${r.replacement_score}</span>
          <button class="swap-item-btn"
            onclick="event.stopPropagation(); doSwap(${dayIdx}, ${exIdx}, '${r.exercise_id}', '${r.name.replace(/'/g,"\\'")}', '${adjJson}')">
            替换
          </button>
        </div>`;
    }
  }
  if (!hasAny) return '';
  return `<div class="swap-panel" id="swap-panel-${dayIdx}-${exIdx}" style="display:none">${items}</div>`;
}

function toggleSwapPanel(dayIdx, exIdx) {
  const panel = document.getElementById(`swap-panel-${dayIdx}-${exIdx}`);
  if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

async function doSwap(dayIdx, exIdx, newId, newName, adjJson) {
  const adj = JSON.parse(adjJson.replace(/&quot;/g, '"'));
  try {
    const res = await fetch(`/api/plan-viewer/swap-exercise${_uq()}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        day_index: dayIdx,
        exercise_index: exIdx,
        replacement_exercise_id: newId,
        replacement_name: newName,
        volume_adjustment: adj,
      }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || '替换失败');
    showToast(`已替换为: ${newName}`);
    await reloadSchedule('v4');
  } catch (e) {
    showToast('替换失败: ' + e.message, true);
  }
}

function renderDayDetail(day, dayIdx) {
  if (dayIdx !== undefined) _currentDayIndex = dayIdx;
  const di = _currentDayIndex;
  const container = document.getElementById('day-detail');
  const isV4 = _currentVersion === 'v4';

  container.innerHTML = day.exercises.map((ex, exIdx) => {
    const pk = phaseKey(ex.phase);
    const isSS = ex.superset_group && ex.superset_group !== 'null';
    const dotClass = isSS ? 'superset' : pk;
    const cardClass = isSS ? 'superset' : pk;
    const phaseCnMap = { warmup: '热身', stretch: '拉伸', main: '主训练' };
    const phaseLabel = isSS ? `超级组 ${ex.superset_group}` : (phaseCnMap[pk] || '主训练');
    const phaseCls   = isSS ? 'superset' : pk;
    const miniSvg    = buildMuscleMini(ex.exercise_id, _currentMuscleMap);
    const hasPool    = isV4 && ex.replacement_pool &&
      Object.values(ex.replacement_pool).some(arr => arr && arr.length > 0);

    return `
    <div class="tl-item">
      <div class="tl-dot ${dotClass}"></div>
      <div class="ex-card ${cardClass}">
        <div class="ex-card-body">
          <div class="ex-header">
            <span class="ex-name">${icon(isSS?'main':pk)} ${ex.name}</span>
            <span class="ex-phase ${phaseCls}">${phaseLabel}</span>
          </div>
          <div class="ex-meta">
            ${ex.sets ? `<span>📦 ${ex.sets} 组</span>` : ''}
            ${ex.reps_or_duration ? `<span>🔁 ${ex.reps_or_duration}</span>` : ''}
            ${ex.rest_sec ? `<span>⏸ 休息 ${ex.rest_sec}s</span>` : ''}
          </div>
          ${ex.notes ? `<div class="ex-notes">${ex.notes}</div>` : ''}
          ${hasPool ? `<button class="btn-swap" onclick="toggleSwapPanel(${di}, ${exIdx})">🔄 切换动作</button>` : ''}
          ${hasPool ? buildSwapPanel(ex, di, exIdx) : ''}
        </div>
        ${miniSvg}
      </div>
    </div>`;
  }).join('');
}

// ── Radar chart (純 Canvas) ──────────────────────────────────
function drawRadar(profile) {
  const canvas = document.getElementById('radarChart');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2, r = Math.min(W,H)/2 - 36;

  // 维度: 力量, 柔韧, 耐力, 核心, 平衡, 恢复
  const dims = ['力量', '柔韧', '耐力', '核心', '平衡', '恢复'];
  // 根据用户画像计算得分 (0-1)
  const lvlMap = { beginner: 0.35, intermediate: 0.65, advanced: 0.9 };
  const base = lvlMap[profile.experience_level] || 0.5;
  const styles = profile.preferred_training_style || [];
  const hasYoga = styles.some(s => s.includes('瑜伽'));
  const hasStr  = styles.some(s => s.includes('力量'));
  const goalFat = profile.fitness_goal === '减脂';

  const scores = [
    Math.min(1, base + (hasStr ? .15 : 0)),              // 力量
    Math.min(1, base + (hasYoga ? .2 : 0)),              // 柔韧
    Math.min(1, base + (goalFat ? .15 : 0)),             // 耐力
    Math.min(1, base + .05),                             // 核心
    Math.min(1, base + (hasYoga ? .1 : 0)),              // 平衡
    Math.min(1, (profile.sleep_hours || 7) / 10),        // 恢复
  ];

  const n = dims.length;
  const angleStep = (2 * Math.PI) / n;
  const startAngle = -Math.PI / 2;

  const toXY = (i, val) => ({
    x: cx + r * val * Math.cos(startAngle + i * angleStep),
    y: cy + r * val * Math.sin(startAngle + i * angleStep),
  });

  // Grid rings
  ctx.clearRect(0, 0, W, H);
  [.25,.5,.75,1].forEach(ring => {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const {x,y} = toXY(i, ring);
      i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // Spokes
  for (let i = 0; i < n; i++) {
    const {x,y} = toXY(i, 1);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.strokeStyle = 'rgba(255,255,255,.1)';
    ctx.stroke();
  }

  // Data polygon
  ctx.beginPath();
  scores.forEach((s, i) => {
    const {x,y} = toXY(i, s);
    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(108,99,255,.25)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(108,99,255,.85)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Dots
  scores.forEach((s, i) => {
    const {x,y} = toXY(i, s);
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, 2*Math.PI);
    ctx.fillStyle = '#6c63ff';
    ctx.fill();
  });

  // Labels
  ctx.font = '13px PingFang SC, system-ui, sans-serif';
  ctx.fillStyle = '#7b80a0';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  dims.forEach((label, i) => {
    const {x,y} = toXY(i, 1.22);
    ctx.fillText(label, x, y);
  });
}

// Coaching notes renderer
// ════════════════════════════════════════════════════════════
function renderCoachingNotes(notes) {
  const el = document.getElementById('coaching-notes');
  if (!notes) { el.style.display = 'none'; return; }

  // Support both structured {warm_up, cool_down, ...} and plain string
  const sections = [
    { key: 'warm_up',        icon: '🌡️', title: '热身建议' },
    { key: 'cool_down',      icon: '🧘', title: '拉伸放松' },
    { key: 'nutrition',      icon: '🥗', title: '饮食建议' },
    { key: 'recovery_boost', icon: '⚡', title: '恢复 & 进阶' },
  ];

  if (typeof notes === 'object' && notes !== null) {
    const items = sections
      .filter(s => notes[s.key])
      .map(s => `
        <div class="coaching-item">
          <div class="coaching-item-icon">${s.icon}</div>
          <div>
            <div class="coaching-item-title">${s.title}</div>
            <div class="coaching-item-body">${notes[s.key]}</div>
          </div>
        </div>`).join('');
    el.innerHTML = `<div class="coaching-grid">${items}</div>`;
  } else {
    // Fallback: plain string — wrap in a simple styled box
    el.innerHTML = `<div class="notes-box" style="margin-top:20px;white-space:pre-wrap">${notes}</div>`;
  }
}

// Edit — profile stats
// ════════════════════════════════════════════════════════════
let _profile = null;  // live copy updated on save

function enterEditStats() {
  const p = _profile;
  const sched = p.available_schedule || {};

  const GOAL_OPTIONS = ['减脂', '增肌', '塑形', '提高耐力', '维持体重', '增强力量'];
  const LEVEL_OPTIONS = [['beginner','初级'], ['intermediate','中级'], ['advanced','高级']];

  const fields = [
    { label: '性别', name: 'gender', type: 'select', options: [['male','男'],['female','女']], value: p.gender },
    { label: '年龄', name: 'age', type: 'number', value: p.age, min: 10, max: 100, unit: '岁' },
    { label: '身高', name: 'height', type: 'number', value: p.height, min: 100, max: 250, unit: 'cm' },
    { label: '体重', name: 'weight', type: 'number', value: p.weight, min: 30, max: 300, unit: 'kg' },
    { label: '睡眠', name: 'sleep_hours', type: 'number', value: p.sleep_hours, min: 1, max: 12, step: 0.5, unit: '小时/天' },
    { label: '训练目标', name: 'fitness_goal', type: 'select', options: GOAL_OPTIONS.map(g=>[g,g]), value: p.fitness_goal },
    { label: '训练水平', name: 'experience_level', type: 'select', options: LEVEL_OPTIONS, value: p.experience_level },
    { label: '每周天数', name: 'days_per_week', type: 'number', value: sched.days_per_week, min: 1, max: 7, unit: '天', sched: true },
    { label: '每次时长', name: 'daily_duration_min', type: 'number', value: sched.daily_duration_min, min: 10, max: 300, unit: '分钟', sched: true },
  ];

  const html = fields.map(f => {
    let input;
    if (f.type === 'select') {
      const opts = f.options.map(([v,l]) =>
        `<option value="${v}"${f.value===v?' selected':''}>${l}</option>`).join('');
      input = `<select class="edit-select" name="${f.name}">${opts}</select>`;
    } else {
      input = `<input class="edit-input" type="number" name="${f.name}" value="${f.value??''}" min="${f.min}" max="${f.max}" step="${f.step||1}">`;
    }
    return `<div class="edit-row"><span class="label">${f.label}</span>${input}</div>`;
  }).join('');

  document.getElementById('profile-stats').innerHTML = html;
  document.getElementById('profile-stats-actions').innerHTML = `
    <button class="btn-save" onclick="saveStats()">保存</button>
    <button class="btn-cancel" onclick="cancelEditStats()">取消</button>`;
}

async function saveStats() {
  const container = document.getElementById('profile-stats');
  const data = {};
  const schedFields = ['days_per_week', 'daily_duration_min'];
  const schedData = {};

  container.querySelectorAll('[name]').forEach(el => {
    const v = el.value.trim();
    if (!v) return;
    if (schedFields.includes(el.name)) {
      schedData[el.name] = Number(v);
    } else if (['age','height','weight'].includes(el.name)) {
      data[el.name] = Number(v);
    } else if (el.name === 'sleep_hours') {
      data[el.name] = parseFloat(v);
    } else {
      data[el.name] = v;
    }
  });

  // Merge schedData with existing schedule
  if (Object.keys(schedData).length) {
    data.available_schedule = Object.assign({}, _profile.available_schedule || {}, schedData);
  }

  try {
    const res = await fetch(`/api/plan-viewer/profile${_uq()}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error(await res.text());
    Object.assign(_profile, data);
    if (data.available_schedule) _profile.available_schedule = data.available_schedule;
    renderProfile(_profile);
    drawRadar(_profile);
    exitEditStats();
    showToast('画像已保存，正在重新生成训练计划…');
    triggerPlanRegeneration();
  } catch (e) {
    showToast('保存失败: ' + e.message, true);
  }
}

function cancelEditStats() {
  renderProfile(_profile);
  exitEditStats();
}

function exitEditStats() {
  document.getElementById('profile-stats-actions').innerHTML =
    `<button class="btn-edit" onclick="enterEditStats()">编辑</button>`;
}

// Edit — training preferences (tags)
// ════════════════════════════════════════════════════════════

function enterEditTags() {
  const p = _profile;
  const sched = p.available_schedule || {};
  const styles = [...(p.preferred_training_style || [])];
  const equip  = [...(p.available_equipment || [])];
  const slots  = [...(sched.free_time_slots || [])];

  document.getElementById('profile-tags').innerHTML = buildTagEditor(styles, equip, slots);
  document.getElementById('profile-tags-actions').innerHTML = `
    <button class="btn-save" onclick="saveTags()">保存</button>
    <button class="btn-cancel" onclick="cancelEditTags()">取消</button>`;
}

function buildTagEditor(styles, equip, slots) {
  function section(label, id, cls, items, placeholder) {
    return `
    <div class="tag-section">
      <div class="tag-section-label">${label}</div>
      <div class="tag-edit-area" id="${id}">${renderEditPills(items, cls)}</div>
      <div class="tag-add-row">
        <input class="tag-add-input" id="${id}-input" placeholder="${placeholder}"
               onkeydown="addTag(event,'${id}','${cls}')"
               oncompositionstart="window._ime_${id}=true"
               oncompositionend="window._ime_${id}=false">
        <button class="btn-tag-add" onclick="addTagByBtn('${id}','${cls}')" title="添加">+</button>
      </div>
    </div>`;
  }
  return section('训练风格', 'tags-style', '',       styles, '输入风格') +
         section('可用器械', 'tags-equip', 'green',  equip,  '输入器械');
}

function renderEditPills(items, cls) {
  return items.map(t =>
    `<span class="pill-editable ${cls}" data-value="${t}">${t}<button class="pill-del" onclick="removeTag(this)" title="删除">×</button></span>`
  ).join('');
}

function removeTag(btn) {
  btn.closest('.pill-editable').remove();
}

function _appendTag(containerId, cls, val) {
  if (!val) return;
  const container = document.getElementById(containerId);
  const span = document.createElement('span');
  span.className = ('pill-editable ' + cls).trim();
  span.dataset.value = val;
  const txt = document.createTextNode(val);
  const btn = document.createElement('button');
  btn.className = 'pill-del';
  btn.title = '删除';
  btn.textContent = '×';
  btn.onclick = () => btn.closest('.pill-editable').remove();
  span.appendChild(txt);
  span.appendChild(btn);
  container.appendChild(span);
}

function addTag(e, containerId, cls) {
  if (e.key !== 'Enter' && e.key !== ',') return;
  // Block while Chinese IME is composing
  if (e.isComposing || window['_ime_' + containerId]) return;
  e.preventDefault();
  const val = e.target.value.trim();
  if (!val) return;
  _appendTag(containerId, cls, val);
  e.target.value = '';
}

function addTagByBtn(containerId, cls) {
  const input = document.getElementById(containerId + '-input');
  const val = input.value.trim();
  if (!val) return;
  _appendTag(containerId, cls, val);
  input.value = '';
  input.focus();
}

function getTagValues(containerId) {
  return [...document.querySelectorAll(`#${containerId} .pill-editable`)].map(el => el.dataset.value);
}

async function saveTags() {
  const styles = getTagValues('tags-style');
  const equip  = getTagValues('tags-equip');
  const slots  = getTagValues('tags-slots');
  const schedUpdate = Object.assign({}, _profile.available_schedule || {}, { free_time_slots: slots });

  try {
    const res = await fetch(`/api/plan-viewer/profile${_uq()}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        preferred_training_style: styles,
        available_equipment: equip,
        available_schedule: schedUpdate,
      }),
    });
    if (!res.ok) throw new Error(await res.text());
    _profile.preferred_training_style = styles;
    _profile.available_equipment = equip;
    if (!_profile.available_schedule) _profile.available_schedule = {};
    _profile.available_schedule.free_time_slots = slots;
    renderProfile(_profile);
    exitEditTags();
    showToast('偏好已保存，正在重新生成训练计划…');
    triggerPlanRegeneration();
  } catch (e) {
    showToast('保存失败: ' + e.message, true);
  }
}

function cancelEditTags() {
  renderProfile(_profile);
  exitEditTags();
}

function exitEditTags() {
  document.getElementById('profile-tags-actions').innerHTML =
    `<button class="btn-edit" onclick="enterEditTags()">编辑</button>`;
}

// ════════════════════════════════════════════════════════════
// Schedule reload & plan regeneration
// ════════════════════════════════════════════════════════════
async function reloadSchedule(version) {
  const ver = version || _currentVersion;
  const [planRes, musclesRes] = await Promise.all([
    fetch(`/api/plan-viewer/latest-plan${_uq(`version=${ver}`)}`),
    fetch(`/api/plan-viewer/muscles-map${_uq()}`),
  ]);
  if (!planRes.ok) throw new Error('计划加载失败');
  const plan = await planRes.json();
  _currentMuscleMap = musclesRes.ok ? await musclesRes.json() : {};
  const schedule = plan.weekly_schedule || [];
  _currentSchedule = schedule;
  renderSummary(schedule);
  renderDayTabs(schedule, i => renderDayDetail(schedule[i], i));
  if (schedule.length > 0) renderDayDetail(schedule[0], 0);
  renderCoachingNotes(plan.coaching_notes);
  renderValidationIssues(plan);
}

function showScheduleLoading() {
  ['summary-chips','day-tabs','day-detail','coaching-notes'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '';
  });
  document.getElementById('day-detail').innerHTML =
    `<div class="regen-overlay"><div class="spinner"></div><div>正在根据新画像重新生成训练计划…</div></div>`;
}

async function triggerPlanRegeneration() {
  showScheduleLoading();
  try {
    const res = await fetch(`/api/plan-viewer/regenerate-plan${_uq()}`, { method: 'POST' });
    const { job_id } = await res.json();
    await pollRegenJob(job_id);
  } catch (e) {
    showToast('计划生成失败: ' + e.message, true);
    await reloadSchedule();
  }
}

async function pollRegenJob(job_id) {
  while (true) {
    await new Promise(r => setTimeout(r, 3000));
    try {
      const res = await fetch(`/api/plan-viewer/regen-status/${job_id}`);
      const job = await res.json();
      if (job.status === 'done') {
        await reloadSchedule();
        showToast('训练计划已更新 ✓');
        return;
      }
      if (job.status === 'error') {
        showToast('计划生成失败: ' + (job.error || '未知错误'), true);
        await reloadSchedule();
        return;
      }
    } catch (_) { /* keep polling */ }
  }
}

// ════════════════════════════════════════════════════════════
// Toast notification
// ════════════════════════════════════════════════════════════
function showToast(msg, isError = false) {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '_toast';
    t.style.cssText = `position:fixed;bottom:28px;right:24px;padding:10px 18px;border-radius:10px;
      font-size:.85rem;font-weight:600;z-index:9999;transition:opacity .4s;pointer-events:none;`;
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.background = isError ? 'rgba(255,101,132,.9)' : 'rgba(67,233,123,.9)';
  t.style.color = '#0f1117';
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 2200);
}

// Plan version (fixed v3)
// ════════════════════════════════════════════════════════════
const _currentVersion = 'v4';

function renderValidationIssues(plan) {
  const area = document.getElementById('validation-area');
  if (!area) return;
  if (plan._pipeline_version !== 'v3') { area.innerHTML = ''; return; }

  // Support both new {_validation: {score,issues,suggestions}} and legacy {_validation_issues:[]}
  const v       = plan._validation || {};
  const issues  = v.issues || plan._validation_issues || [];
  const score   = v.score;
  const suggest = v.suggestions || '';
  const isValid = v.is_valid !== undefined ? v.is_valid : issues.length === 0;

  const scoreChip = score != null
    ? `<span style="margin-left:6px;font-size:.7rem;color:var(--muted)">评分 ${score}/10</span>`
    : '';

  if (isValid && issues.length === 0) {
    area.innerHTML = `<div style="margin-bottom:12px">
      <span class="validation-badge ok" onclick="this.nextElementSibling.classList.toggle('open')">
        ✓ LLM 规则校验通过
      </span>${scoreChip}
      <div class="validation-list">${suggest || '所有 FITT-VP 规则均已满足。'}</div>
    </div>`;
  } else {
    
  }
}

// User selector
// ════════════════════════════════════════════════════════════
let _userList = [];

async function loadUserList() {
  const res = await fetch(`${API}/api/plan-viewer/users`);
  _userList = await res.json();
  const sel = document.getElementById('user-select');
  sel.innerHTML = _userList.map(u => {
    const desc = `${u.label} · ${u.gender === 'female' ? '女' : '男'} · ${u.age}岁 · ${u.fitness_goal}`;
    return `<option value="${u.user_id}">${desc}</option>`;
  }).join('');
  // Default: first user or from URL param
  const params = new URLSearchParams(location.search);
  const fromUrl = params.get('user_id');
  if (fromUrl && _userList.some(u => u.user_id === fromUrl)) {
    _currentUserId = fromUrl;
  } else if (_userList.length) {
    _currentUserId = _userList[0].user_id;
  }
  sel.value = _currentUserId;
}

async function switchUser(uid) {
  if (uid === _currentUserId) return;
  _currentUserId = uid;
  // Update URL without reload
  const url = new URL(location);
  url.searchParams.set('user_id', uid);
  history.replaceState(null, '', url);
  // Re-render everything
  await renderAllForCurrentUser();
}

async function renderAllForCurrentUser() {
  document.getElementById('loading').style.display = 'grid';
  document.getElementById('app').style.display = 'none';
  try {
    const { profile, plan, muscleMap, frontSvg, backSvg } = await fetchData();
    if (plan._empty) {
      document.getElementById('loading').innerHTML =
        `<div class="error-box" style="background:#1a1d27;border:1px solid #2e334d;color:#e8eaf0;padding:32px;border-radius:12px;text-align:center">
          📋 暂无训练计划<br><small style="color:#7b80a0">请先通过 plan_generator.py 生成计划</small>
        </div>`;
      return;
    }
    const schedule = plan.weekly_schedule || [];

    _currentMuscleMap = muscleMap;
    injectSvgTemplates(frontSvg, backSvg);

    document.getElementById('plan-name').textContent = plan.plan_name || '训练计划';
    document.getElementById('plan-meta').textContent =
      `目标: ${plan.fitness_goal || profile.fitness_goal}  ·  ${schedule.length} 天 / 周  ·  生成于 ${new Date().toLocaleDateString('zh-CN')}`;
    document.getElementById('avatar-icon').textContent =
      profile.gender === 'female' ? '🧘‍♀️' : '🏋️';

    _profile = profile;
    _currentSchedule = schedule;
    renderProfile(profile);
    renderSummary(schedule);
    renderDayTabs(schedule, i => renderDayDetail(schedule[i], i));
    if (schedule.length > 0) renderDayDetail(schedule[0], 0);

    renderCoachingNotes(plan.coaching_notes);
    renderValidationIssues(plan);
    drawRadar(profile);


    document.getElementById('user-select').value = _currentUserId;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('day-detail').innerHTML =
      `<div class="error-box">⚠️ ${err.message}<br><small>请确认后端 API 已启动</small></div>`;
  }
}

// ════════════════════════════════════════════════════════════
// Equipment scenes
// ════════════════════════════════════════════════════════════
const ALL_EQUIPMENT = ["弹力带","缆绳机","哑铃","训练凳","单杠","器械","杠铃","壶铃","自重","双杠","史密斯架"];
let _scenes = [];
let _expandedSceneId = null;

async function loadEquipmentScenes() {
  const res = await fetch(`${API}/api/plan-viewer/equipment-scenes${_uq()}`);
  _scenes = await res.json();
  renderSceneList();
}

function renderSceneList() {
  const container = document.getElementById('scene-list');
  if (!container) return;
  const canAdd = _scenes.length < 5;
  container.innerHTML = _scenes.map(s => {
    const isExpanded = _expandedSceneId === s.id;
    return `
    <div class="scene-card ${s.is_active ? 'active' : ''} ${isExpanded ? '' : 'scene-collapsed'}"
         onclick="toggleSceneExpand(${s.id}, event)">
      <div class="scene-card-header">
        <div class="scene-card-name">
          ${s.is_active ? '<span class="active-dot"></span>' : ''}
          ${s.scene_name}
        </div>
        <div class="scene-card-actions" onclick="event.stopPropagation()">
          ${!s.is_active ? `<button onclick="activateScene(${s.id})" title="启用">✓</button>` : ''}
          <button onclick="openSceneModal(${s.id})" title="编辑">✎</button>
          ${_scenes.length > 1 ? `<button class="del" onclick="deleteScene(${s.id})" title="删除">✕</button>` : ''}
        </div>
      </div>
      <div class="scene-equip-pills">
        ${s.equipment.map(e => `<span class="pill green">${e}</span>`).join('')}
      </div>
    </div>`;
  }).join('') + (canAdd ? `<div class="btn-add-scene" onclick="openSceneModal(null)">+ 添加器械场景</div>` : '');
}

function toggleSceneExpand(id, e) {
  if (e.target.closest('.scene-card-actions')) return;
  _expandedSceneId = _expandedSceneId === id ? null : id;
  renderSceneList();
}

async function activateScene(id) {
  const res = await fetch(`${API}/api/plan-viewer/equipment-scenes/${id}/activate${_uq()}`, { method: 'POST' });
  if (!res.ok) { showToast('启用失败', true); return; }
  const data = await res.json();
  _profile.available_equipment = data.equipment;
  const pills = document.getElementById('equip-pills');
  if (pills) pills.innerHTML = data.equipment.map(e => `<span class="pill green">${e}</span>`).join('');
  await loadEquipmentScenes();
  showToast('器械场景已切换，正在重新生成训练计划…');
  triggerPlanRegeneration();
}

async function deleteScene(id) {
  const res = await fetch(`${API}/api/plan-viewer/equipment-scenes/${id}${_uq()}`, { method: 'DELETE' });
  if (!res.ok) { showToast('删除失败', true); return; }
  if (_expandedSceneId === id) _expandedSceneId = null;
  await loadEquipmentScenes();
  showToast('场景已删除');
}

function openSceneModal(sceneId) {
  const existing = sceneId ? _scenes.find(s => s.id === sceneId) : null;
  const name = existing ? existing.scene_name : '';
  const selected = existing ? [...existing.equipment] : ['自重'];

  const overlay = document.createElement('div');
  overlay.className = 'scene-modal-overlay';
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
  <div class="scene-modal">
    <h3>${existing ? '编辑器械场景' : '新建器械场景'}</h3>
    <label>场景名称</label>
    <input type="text" id="scene-name-input" value="${name}" maxlength="20" placeholder="例如: 家庭训练">
    <label>选择器械（可多选）</label>
    <div class="equip-grid" id="equip-grid">
      ${ALL_EQUIPMENT.map(e => `<div class="equip-option ${selected.includes(e) ? 'selected' : ''}" data-equip="${e}" onclick="this.classList.toggle('selected')">${e}</div>`).join('')}
    </div>
    <div class="scene-modal-btns">
      <button class="btn-cancel" onclick="this.closest('.scene-modal-overlay').remove()">取消</button>
      <button class="btn-save" onclick="saveSceneFromModal(${sceneId})">保存</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#scene-name-input').focus();
}

async function saveSceneFromModal(sceneId) {
  const overlay = document.querySelector('.scene-modal-overlay');
  const nameInput = document.getElementById('scene-name-input');
  const sceneName = nameInput.value.trim() || '未命名场景';
  const equipment = [...document.querySelectorAll('#equip-grid .equip-option.selected')].map(el => el.dataset.equip);
  if (equipment.length === 0) { showToast('请至少选择一种器械', true); return; }

  const isActive = sceneId ? (_scenes.find(s => s.id === sceneId)?.is_active || false) : (_scenes.length === 0);
  const body = { scene_name: sceneName, equipment, is_active: isActive };

  let res;
  if (sceneId) {
    res = await fetch(`${API}/api/plan-viewer/equipment-scenes/${sceneId}${_uq()}`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
    });
  } else {
    res = await fetch(`${API}/api/plan-viewer/equipment-scenes${_uq()}`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
    });
  }

  if (!res.ok) { showToast((await res.json()).detail || '保存失败', true); return; }
  overlay.remove();
  if (isActive) {
    _profile.available_equipment = equipment;
    const pills = document.getElementById('equip-pills');
    if (pills) pills.innerHTML = equipment.map(e => `<span class="pill green">${e}</span>`).join('');
  }
  await loadEquipmentScenes();
  showToast('场景已保存');
}

// Boot

(async () => {
  try {
    await loadUserList();
    await renderAllForCurrentUser();
  } catch (err) {
    document.getElementById('loading').innerHTML =
      `<div class="error-box">⚠️ ${err.message}<br><small>请确认后端 API 已启动</small></div>`;
  }
})();
</script>
